name: Loupe review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Whip
        env:
          WHIP_VERSION: v0.5.14
        run: curl -fsSL https://raw.githubusercontent.com/context-labs/whip/main/install.sh | sh

      # PR #15: https://github.com/context-labs/loupe/pull/15
      - name: Run Loupe
        uses: context-labs/loupe@deae4c0c869d95c1a74c630a396e07884b59d9e4
        with:
          harness: whip
          reasoning: medium
        env:
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
